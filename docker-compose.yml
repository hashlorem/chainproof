services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chainproof
      POSTGRES_PASSWORD: chainproof
      POSTGRES_DB: chainproof
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chainproof
      MINIO_ROOT_PASSWORD: chainproof-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  dbdata:
  minio:
